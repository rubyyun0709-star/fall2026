<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaeeun Yun — Design Portfolio</title>
<meta name="description" content="Chaeeun Yun is a graphic and UX/UI designer working across editorial, identity, packaging and app design.">
<meta property="og:title" content="Chaeeun Yun — Design Portfolio">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--mute:#8a8a8a;--line:#d9d9d9;--pad:10px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#ececec;--mute:#8d8d8d;--line:#333;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%;font:clamp(14px,.55vw + 10.5px,17px)/1.3 "Hanken Grotesk",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;gap:0 var(--pad);padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) max(var(--pad),env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left))}
.pane{min-height:0;display:flex;flex-direction:column;border-right:0}
.pane+.pane{border-left:1px solid var(--line);padding-left:var(--pad)}
.pane>h2{margin:0 0 var(--pad);padding-bottom:6px;border-bottom:1px solid var(--line);font-weight:400;font-size:inherit;display:flex;justify-content:space-between}
.scroll{flex:1;overflow-y:auto;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.foot{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px;margin-top:var(--pad)}
.foot button{padding:6px 0}
.foot button:hover,.foot button[aria-current=true]{text-decoration:underline;text-underline-offset:3px}
.item{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:var(--pad)}
.item img,.shots img{display:block;width:100%;height:auto;background:#eee}
.item>button{width:100%;display:block}
.cap{display:grid;grid-template-columns:1fr 1fr;gap:var(--pad);margin-top:10px}
.cap p,.info p{margin:0 0 14px}
.cap .m{white-space:pre-line}
.view{text-decoration:underline;text-underline-offset:3px}
.mute{color:var(--mute)}
.shots img{margin-bottom:var(--pad);cursor:zoom-in}
.meta{white-space:pre-line;margin:0 0 14px}
.desc{max-width:62ch}
.info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:var(--pad);border-bottom:1px solid var(--line);padding:0 0 26px;margin-bottom:var(--pad)}
.info:last-child{border:0}
.info p{margin:0 0 14px}
.info a{overflow-wrap:anywhere}
.bio{font-size:1.1em;line-height:1.3}
.job{margin:0 0 24px}
.job p{margin:0}
.job ul{list-style:none;margin:8px 0 0;padding:0}
.job li{padding-left:1.1em;text-indent:-1.1em;margin-bottom:5px}
.job li::before{content:"– "}
.job .r{display:flex;justify-content:space-between;gap:var(--pad)}
.job .r span:last-child{text-align:right;white-space:nowrap}
#lb{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out;padding:var(--pad)}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
@media (max-width:820px){
 :root{--pad:12px}
 .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
 .pane{display:none}.pane.on{display:flex}
 .pane+.pane{border-left:0;padding-left:0}
 .cap,.info{grid-template-columns:1fr;gap:6px}
 .info>div:first-child{color:var(--mute)}
 .foot button{padding:10px 0}
 .shots img{margin-bottom:8px}
}
@media (max-width:420px){.job .r{flex-direction:column;gap:0}.job .r span:last-child{text-align:left;white-space:normal}}
@media (min-width:1800px){.app{max-width:2200px;margin:0 auto}}
@media (prefers-reduced-motion:no-preference){.pane.on .scroll{animation:in .25s ease-out}@keyframes in{from{opacity:.4}}}
.job{margin-bottom:20px}.job p{margin:0 0 8px}.job ul{margin:0;padding:0;list-style:none}.job li{padding-left:1em;text-indent:-1em;margin-bottom:5px}.job li::before{content:"– "}
.info p:last-child{margin-bottom:0}.info>div:last-child{max-width:68ch}
@media (max-width:1100px){.info{grid-template-columns:1fr 2fr}}
@media (max-width:820px){
 html{-webkit-text-size-adjust:100%}
 body{font-size:14.5px}
 .app{padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
 .foot{padding:8px 0 2px}.foot button{padding:4px 0}
 .info{gap:6px;padding-bottom:20px}.info>div:first-child{color:var(--mute)}.bio{font-size:16px}
 .cap{gap:6px}
 .item{padding-bottom:16px}
 #close{padding:2px 0}
}
@media (min-width:1700px){body{font-size:16px}.app{padding:14px}}
</style>
</head>

    <button data-go="index" aria-current="true">Chaeeun Yun</button>

{id:"perspective-shift",t:"Perspective Shift",k:"Painting, editorial, packaging, app",y:"2023–2024",tool:"Gouache on canvas, 18 × 24 × 2.5 in\nAdobe Photoshop, InDesign",imgs:["p07","p08","p09","p10"],

{id:"social-dilemma",t:"Social Dilemma",k:"Poster, editorial, performative art",y:"2023–2025",tool:"Mixed media, acrylic and OHP film on raincoat, 16 × 10 × 68.5 in\nAdobe InDesign, Photoshop",imgs:["p12","p13","p14","p15","p16"],

{id:"suicide-life-and-art",t:"Suicide, Life, and Art",k:"Wiki book",y:"2025",tool:"Adobe InDesign\nMyungjo Medium, Baskerville, KozMin, Mrs Eaves XL, Osaka Mono",imgs:["p25","p26","p27","p28"],

 m:"Editorial design, photography\nModel: Ahhyeon"},
{id:"five-tips-for-solopreneurs",t:"Five Tips for Solopreneurs",k:"Newspaper-style booklets",y:"2026",tool:"Adobe InDesign",imgs:["p34","p35","p33","p36"],
 d:["Newspaper-style booklets that turn a 2026 article for New York solopreneurs into a visual guide to five tips: clarify the problem you solve, start small and test, maximize savings, build a clear brand, and plan for growth.","One booklet is purely typographic, using hierarchy, contrast and repetition to make each tip a bold headline. Another combines collage and type so images, grids and letterforms read as an editorial roadmap."],
 m:"Typography, collage, editorial"},
{id:"outsider-art-fair",t:"Outsider Art Fair Identity",k:"Flexible visual identity",y:"2025–2026",tool:"Adobe InDesign, Photoshop\nFutura, Circular Grid",imgs:["p41","p42","p43","p44","p38","p39","p40"],

 m:"Visual identity, print, signage"},

 m:"UX/UI design, prototype\nCore Interaction 2"},
{id:"likelion-marketing",t:"LikeLion US NYU Marketing",k:"Social media design",y:"2025–2026",tool:"Figma Design, Nano Banana\nInter",imgs:["p53","p54"],

five-person team, applying typography, layout, and color principles from coursework to real client-facing work."]], ["Fine Arts Council Club, Burnaby North Secondary", "Executive Creative Director", "Vancouver, Canada", "Nov 2022 – Jun 2024", ["Led visual direction for 10+ school art events per year, creating posters, digital assets, and Instagram advertisements that helped attract 50+ student participants and generate over $200 in fundraising revenue. Collaborated with other committees to design merchandise, aligning visuals with overall event concepts."]], ["Peer Tutor Class, Burnaby North Secondary", "Peer Art Teacher Tutor", "Vancouver, Canada", "Nov 2023 – Jun 2024", ["Mentored students on individual art projects for school shows, encouraging their creative process and confidence.", "Prepared materials and studio space, modeling good studio habits and supporting students with disabilities."]]];

<p><a href="mailto:rubyyun0709@gmail.com">rubyyun0709@gmail.com</a><br>+1 646-404-7512<br><a href="https://www.linkedin.com/in/ruby-yun-20474332a" target="_blank" rel="noopener">LinkedIn</a><br>English, Korean</p></div>
<div class="bio"><p>I design environments, both digital and physical, where people can gather, feel included and have fun together.</p>
<p>My work lowers social barriers, sparks interaction and makes it easier for different people to share a moment in the same space. I work across editorial, identity, packaging, typography and app design.</p></div></div>
<div class="info"><div>Education</div><div><p>Parsons School of Design, The New School<br>BFA Communication Design, Minor in Creative Entrepreneurship<br>Aug 2024 – May 2028<br>GPA 3.89 / 4.0<br>Merit Scholarship, Dean’s List</p></div></div>
<div class="info"><div>Work Experience</div><div><div class="job"><p class="jh">Parsons School of Design, The New School<br>Student Assistant, Parsons Making Center<br><span class="mute">New York, NY, Mar 2026 – Present</span></p><ul><li>Support daily operations at the Parsons Making Center, primarily in the Wet Shops: Casting &amp; Ceramics.</li><li>Assist technicians in maintaining a safe, organized and welcoming studio environment for students and faculty.</li><li>Provide basic technical guidance and troubleshooting support to students exploring ceramic and casting processes.</li></ul></div><div class="job"><p class="jh">Like Lion US (E-Board)<br>Marketing &amp; Graphic Design Member<br><span class="mute">New York, NY, Sep 2025 – Present</span></p><ul><li>Co-created Instagram posts and reels for the US chapter, including a short-form video that reached 7,000+ views.</li><li>Participate in a UI/UX study group to practice wireframes and user flows in Figma, incorporating critique to refine interaction and visual design, leading to an average of 2,000+ views per post.</li><li>Support community events with simple branding and social media visuals that keep the design language consistent.</li></ul></div><div class="job"><p class="jh">Material Exchange, The New School<br>Student Design &amp; Studio + Sales Assistant<br><span class="mute">New York, NY, Sep 2024 – Sep 2026</span></p><ul><li>Designed social media posters and on-campus signage promoting material reuse, with videos reaching 500+ views and encouraging students to reuse or donate materials.</li><li>Help students find and exchange materials, documenting usage patterns that inform future visual communication for the space.</li></ul></div><div class="job"><p class="jh">Filption<br>Creative &amp; Content Intern<br><span class="mute">New York, NY, Sep 2025 – Dec 2025</span></p><ul><li>Designed pixel-style “Outfit Battle” logo and social assets, helping the brand gain 1,000+ new followers and 5,000+ views across Reels.</li><li>Produced AI-based virtual try-on for fashion brands by combining Canva, CapCut and generative tools, improving content turnaround time for the team.</li><li>Planned and led street interview NYFW short-form content, from concept to shooting, strengthening Filption’s presence as an AI fashion startup.</li><li>Collaborated directly with the CEO in a five-person team, applying typography, layout and color principles from coursework to real client-facing work.</li></ul></div><div class="job"><p class="jh">Fine Arts Council Club, Burnaby North Secondary<br>Executive Creative Director<br><span class="mute">Vancouver, Canada, Nov 2022 – Jun 2024</span></p><ul><li>Led visual direction for 10+ school art events per year, creating posters, digital assets and Instagram advertisements that helped attract 50+ student participants and generate over $200 in fundraising revenue. Collaborated with other committees to design merchandise, aligning visuals with overall event concepts.</li></ul></div><div class="job"><p class="jh">Peer Tutor Class, Burnaby North Secondary<br>Peer Art Teacher Tutor<br><span class="mute">Vancouver, Canada, Nov 2023 – Jun 2024</span></p><ul><li>Mentored students on individual art projects for school shows, encouraging their creative process and confidence.</li><li>Prepared materials and studio space, modeling good studio habits and supporting students with disabilities.</li></ul></div></div></div>

L.innerHTML=P.map(p=>`<article class="item"><button data-id="${p.id}" aria-label="Open ${p.t}"><img src="${src(p.imgs[0])}" alt="${p.t}" loading="lazy"></button>
<div class="cap"><p>${p.t}</p><div><p class="m">${p.k}\n${p.y}</p><p><button class="view" data-id="${p.id}">[View..]</button></p></div></div></article>`).join('');
$('#count').textContent=P.length+' projects';
function pane(which){
  $('#p-index').classList.toggle('on',which==='index');
  $('#p-right').classList.toggle('on',which!=='index');
  document.querySelectorAll('.foot button').forEach(b=>b.setAttribute('aria-current',String((which==='index')===(b.dataset.go==='index'))));
}
function show(id,push=true){
  const p=P.find(x=>x.id===id);
  if(!p){R.innerHTML=info;$('#rtitle').textContent='Information';$('#close').hidden=true;return}
  $('#rtitle').textContent=p.t;$('#close').hidden=false;
  R.innerHTML=`<div class="desc"><p class="meta">${p.k}\n${p.y}\n${p.tool}</p>${p.d.map(t=>`<p>${t}</p>`).join('')}<p class="mute meta">${p.m}</p></div>
  <div class="shots">${p.imgs.map((n,i)=>`<img src="${src(n)}" alt="${p.t}, image ${i+1}" loading="lazy">`).join('')}</div>`;
  R.scrollTop=0;pane('right');if(push)history.pushState(null,'','#'+id);
}
function home(push=true){R.innerHTML=info;$('#rtitle').textContent='Information';$('#close').hidden=true;if(push)history.pushState(null,'',location.pathname)}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){if(g.dataset.go==='index'){home();pane('index')}else{home();pane('right')}return}
  const b=e.target.closest('[data-id]');if(b){show(b.dataset.id);return}
  if(e.target.closest('#close')){home();if(matchMedia('(max-width:820px)').matches)pane('index')}
  if(e.target.matches('.shots img')){lb.firstElementChild.src=e.target.src;lb.classList.add('on')}
  else if(lb.classList.contains('on'))lb.classList.remove('on');
});
addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on')});
function route(){const h=location.hash.slice(1);h?show(h,false):home(false)}
addEventListener('popstate',route);
home(false);if(location.hash)show(location.hash.slice(1),false);
if(matchMedia('(max-width:820px)').matches&&!location.hash)pane('index');
